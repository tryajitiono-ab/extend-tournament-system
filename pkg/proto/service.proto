syntax = "proto3";

option csharp_namespace = "AccelByte.Extend.ServiceExtension";
option go_package = "extend-tournament-service/pkg/pb";
option java_package = "net.accelbyte.extend.serviceextension";
option java_multiple_files = true;

package tournament;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "permission.proto";

enum TournamentStatus {
  TOURNAMENT_STATUS_UNSPECIFIED = 0;
  TOURNAMENT_STATUS_DRAFT = 1;
  TOURNAMENT_STATUS_ACTIVE = 2;
  TOURNAMENT_STATUS_STARTED = 3;
  TOURNAMENT_STATUS_COMPLETED = 4;
  TOURNAMENT_STATUS_CANCELLED = 5;
}

message TournamentParticipant {
  string user_id = 1;
  string username = 2;
  string display_name = 3;
}

message Participant {
  string participant_id = 1;
  string user_id = 2;
  string username = 3;
  string display_name = 4;
  string tournament_id = 5;
  google.protobuf.Timestamp registered_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message Tournament {
  string tournament_id = 1;
  string name = 2;
  string description = 3;
  int32 max_participants = 4;
  int32 current_participants = 5;
  TournamentStatus status = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  google.protobuf.Timestamp start_time = 9;
  google.protobuf.Timestamp end_time = 10;
}

message CreateTournamentRequest {
  string namespace = 1;
  string name = 2;
  string description = 3;
  int32 max_participants = 4;
  google.protobuf.Timestamp start_time = 5;
  google.protobuf.Timestamp end_time = 6;
}

message CreateTournamentResponse {
  Tournament tournament = 1;
}

message ListTournamentsRequest {
  string namespace = 1;
  int32 limit = 2;
  int32 offset = 3;
  TournamentStatus status = 4;
  google.protobuf.Timestamp start_date_from = 5;
  google.protobuf.Timestamp start_date_to = 6;
}

message ListTournamentsResponse {
  repeated Tournament tournaments = 1;
  int32 total_count = 2;
}

message GetTournamentRequest {
  string namespace = 1;
  string tournament_id = 2;
}

message GetTournamentResponse {
  Tournament tournament = 1;
}

message ActivateTournamentRequest {
  string namespace = 1;
  string tournament_id = 2;
}

message ActivateTournamentResponse {
  Tournament tournament = 1;
}

message StartTournamentRequest {
  string namespace = 1;
  string tournament_id = 2;
}

message StartTournamentResponse {
  Tournament tournament = 1;
}

message CancelTournamentRequest {
  string namespace = 1;
  string tournament_id = 2;
}

message CancelTournamentResponse {
  Tournament tournament = 1;
}

message RegisterForTournamentRequest {
  string namespace = 1;
  string tournament_id = 2;
}

message RegisterForTournamentResponse {
  string participant_id = 1;
  string tournament_id = 2;
  string user_id = 3;
  google.protobuf.Timestamp registered_at = 4;
}

message GetTournamentParticipantsRequest {
  string namespace = 1;
  string tournament_id = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message GetTournamentParticipantsResponse {
  repeated Participant participants = 1;
  int32 total_participants = 2;
  string next_page_token = 3;
}

message RemoveParticipantRequest {
  string namespace = 1;
  string tournament_id = 2;
  string user_id = 3;
}

message RemoveParticipantResponse {
  string tournament_id = 1;
  string user_id = 2;
  bool removed = 3;
}

enum MatchStatus {
  MATCH_STATUS_UNSPECIFIED = 0;
  MATCH_STATUS_SCHEDULED = 1;
  MATCH_STATUS_IN_PROGRESS = 2;
  MATCH_STATUS_COMPLETED = 3;
  MATCH_STATUS_CANCELLED = 4;
}

message Match {
  string match_id = 1;
  string tournament_id = 2;
  int32 round = 3;
  int32 position = 4;
  TournamentParticipant participant1 = 5;
  TournamentParticipant participant2 = 6;
  string winner = 7;
  MatchStatus status = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp completed_at = 10;
  string next_match_id = 11;
  string source_match_1_id = 12;
  string source_match_2_id = 13;
}

message GetTournamentMatchesRequest {
  string namespace = 1;
  string tournament_id = 2;
  int32 round = 3;
}

message GetTournamentMatchesResponse {
  repeated Match matches = 1;
  int32 total_rounds = 2;
  int32 current_round = 3;
}

message GetMatchRequest {
  string namespace = 1;
  string tournament_id = 2;
  string match_id = 3;
}

message GetMatchResponse {
  Match match = 1;
}

message SubmitMatchResultRequest {
  string namespace = 1;
  string tournament_id = 2;
  string match_id = 3;
  string winner_user_id = 4;
}

message SubmitMatchResultResponse {
  Match match = 1;
}

message AdminSubmitMatchResultRequest {
  string namespace = 1;
  string tournament_id = 2;
  string match_id = 3;
  string winner_user_id = 4;
}

message AdminSubmitMatchResultResponse {
  Match match = 1;
}

service TournamentService {

  rpc AdminCreateTournament (CreateTournamentRequest) returns (CreateTournamentResponse) {
    option (permission.action) = CREATE;
    option (permission.resource) = "ADMIN:NAMESPACE:{namespace}:EXTEND:APPUI";
    option (google.api.http) = {
      post: "/v1/admin/namespace/{namespace}/tournaments"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create Tournament"
      description: "Create a new tournament. Requires admin permission."
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  rpc ListTournaments (ListTournamentsRequest) returns (ListTournamentsResponse) {
    // Public read permission: READ on NAMESPACE:{namespace}:TOURNAMENT
    // Only returns ACTIVE, STARTED, and COMPLETED tournaments.
    option (permission.action) = READ;
    option (permission.resource) = "NAMESPACE:{namespace}:TOURNAMENT";
    option (google.api.http) = {
      get: "/v1/public/namespace/{namespace}/tournaments"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List Tournaments (Public)"
      description: "List publicly visible tournaments (ACTIVE, STARTED, COMPLETED). Requires player permission."
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  rpc AdminListTournaments (ListTournamentsRequest) returns (ListTournamentsResponse) {
    // Admin read permission: READ on ADMIN:NAMESPACE:{namespace}:EXTEND:APPUI
    // Returns all tournaments regardless of status.
    option (permission.action) = READ;
    option (permission.resource) = "ADMIN:NAMESPACE:{namespace}:EXTEND:APPUI";
    option (google.api.http) = {
      get: "/v1/admin/namespace/{namespace}/tournaments"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List Tournaments (Admin)"
      description: "List all tournaments including DRAFT and CANCELLED. Requires admin permission."
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  rpc GetTournament (GetTournamentRequest) returns (GetTournamentResponse) {
    // Public read permission: READ on NAMESPACE:{namespace}:TOURNAMENT
    // Only returns publicly visible tournaments (ACTIVE, STARTED, COMPLETED).
    option (permission.action) = READ;
    option (permission.resource) = "NAMESPACE:{namespace}:TOURNAMENT";
    option (google.api.http) = {
      get: "/v1/public/namespace/{namespace}/tournaments/{tournament_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Tournament (Public)"
      description: "Get a publicly visible tournament by ID. Requires player permission."
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  rpc AdminGetTournament (GetTournamentRequest) returns (GetTournamentResponse) {
    // Admin read permission: READ on ADMIN:NAMESPACE:{namespace}:EXTEND:APPUI
    // Returns any tournament regardless of status.
    option (permission.action) = READ;
    option (permission.resource) = "ADMIN:NAMESPACE:{namespace}:EXTEND:APPUI";
    option (google.api.http) = {
      get: "/v1/admin/namespace/{namespace}/tournaments/{tournament_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Tournament (Admin)"
      description: "Get any tournament by ID including DRAFT and CANCELLED. Requires admin permission."
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  rpc AdminActivateTournament (ActivateTournamentRequest) returns (ActivateTournamentResponse) {
    option (permission.action) = UPDATE;
    option (permission.resource) = "ADMIN:NAMESPACE:{namespace}:EXTEND:APPUI";
    option (google.api.http) = {
      post: "/v1/admin/namespace/{namespace}/tournaments/{tournament_id}/activate"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Activate Tournament"
      description: "Open a tournament for player registration. Requires admin permission."
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  rpc AdminStartTournament (StartTournamentRequest) returns (StartTournamentResponse) {
    option (permission.action) = UPDATE;
    option (permission.resource) = "ADMIN:NAMESPACE:{namespace}:EXTEND:APPUI";
    option (google.api.http) = {
      post: "/v1/admin/namespace/{namespace}/tournaments/{tournament_id}/start"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Start Tournament"
      description: "Generate brackets and begin competition. Requires admin permission."
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  rpc AdminCancelTournament (CancelTournamentRequest) returns (CancelTournamentResponse) {
    option (permission.action) = UPDATE;
    option (permission.resource) = "ADMIN:NAMESPACE:{namespace}:EXTEND:APPUI";
    option (google.api.http) = {
      post: "/v1/admin/namespace/{namespace}/tournaments/{tournament_id}/cancel"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Cancel Tournament"
      description: "Cancel a tournament and prevent further participation. Requires admin permission."
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  rpc RegisterForTournament (RegisterForTournamentRequest) returns (RegisterForTournamentResponse) {
    option (permission.action) = CREATE;
    option (permission.resource) = "NAMESPACE:{namespace}:EXTEND:TOURNAMENT";
    option (google.api.http) = {
      post: "/v1/public/namespace/{namespace}/tournaments/{tournament_id}/register"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Register for Tournament"
      description: "Register the authenticated user for a tournament. Requires player permission."
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  rpc GetTournamentParticipants (GetTournamentParticipantsRequest) returns (GetTournamentParticipantsResponse) {
    option (permission.action) = READ;
    option (permission.resource) = "NAMESPACE:{namespace}:EXTEND:TOURNAMENT";
    option (google.api.http) = {
      get: "/v1/public/namespace/{namespace}/tournaments/{tournament_id}/participants"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Tournament Participants"
      description: "List all participants for a tournament with pagination. Requires player permission."
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  rpc AdminRemoveParticipant (RemoveParticipantRequest) returns (RemoveParticipantResponse) {
    option (permission.action) = DELETE;
    option (permission.resource) = "ADMIN:NAMESPACE:{namespace}:EXTEND:APPUI";
    option (google.api.http) = {
      delete: "/v1/admin/namespace/{namespace}/tournaments/{tournament_id}/participants/{user_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Remove Tournament Participant"
      description: "Remove a participant from a tournament. Requires admin permission."
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  rpc GetTournamentMatches (GetTournamentMatchesRequest) returns (GetTournamentMatchesResponse) {
    option (permission.action) = READ;
    option (permission.resource) = "NAMESPACE:{namespace}:EXTEND:TOURNAMENT";
    option (google.api.http) = {
      get: "/v1/public/namespace/{namespace}/tournaments/{tournament_id}/matches"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Tournament Matches"
      description: "Get all matches for a tournament organized by round. Requires player permission."
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  rpc GetMatch (GetMatchRequest) returns (GetMatchResponse) {
    option (permission.action) = READ;
    option (permission.resource) = "NAMESPACE:{namespace}:EXTEND:TOURNAMENT";
    option (google.api.http) = {
      get: "/v1/public/namespace/{namespace}/tournaments/{tournament_id}/matches/{match_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Match Details"
      description: "Get detailed information about a specific match. Requires player permission."
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  rpc AdminSubmitMatchResult (SubmitMatchResultRequest) returns (SubmitMatchResultResponse) {
    option (permission.action) = UPDATE;
    option (permission.resource) = "ADMIN:NAMESPACE:{namespace}:EXTEND:APPUI";
    option (google.api.http) = {
      post: "/v1/admin/namespace/{namespace}/tournaments/{tournament_id}/matches/{match_id}/result"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Submit Match Result"
      description: "Submit a match result and advance the winner. Requires admin permission."
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }
}

// OpenAPI options for entire API.
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Tournament API";
    version: "1.0";
  };
  base_path: "/tournament";

  security_definitions: {
    security: {
      key: "Bearer";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Bearer token from AccelByte IAM (player or admin JWT)";
      }
    }
  };
};