services:
  mongodb:
    image: mongo:8.0
    network_mode: host
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: |
        mongosh --eval "
        try {
          rs.status();
        } catch(e) {
          rs.initiate({
            _id: 'rs0',
            members: [{ _id: 0, host: 'localhost:27017' }]
          });
        }
        db.runCommand({ ping: 1 });
        "
      interval: 10s
      retries: 10
      start_period: 40s
      timeout: 10s
